<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Smart Blocus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Smart Blocus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Idée : une feuille de bloc quadrillée, encre bleu nuit, surligneur jaune pour ce qui compte. */
:root{
  --paper:#F4F5EF; --card:#FFFFFF; --ink:#18203A; --mute:#636B84; --line:#D9DCE6; --grid:rgba(24,32,58,.055);
  --hl:#FFDF3D; --pen:#2B55E0; --good:#16895A; --warn:#C96A10; --bad:#CC3B37; --soft:#EEF0F7;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"Instrument Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12151F; --card:#1B2030; --ink:#ECEEF6; --mute:#9AA2BC; --line:#31384E; --grid:rgba(236,238,246,.045);
    --hl:#FFDF3D; --pen:#8AA4FF; --good:#4CC790; --warn:#F0A04B; --bad:#FF7A72; --soft:#242A3D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12151F; --card:#1B2030; --ink:#ECEEF6; --mute:#9AA2BC; --line:#31384E; --grid:rgba(236,238,246,.045);
  --hl:#FFDF3D; --pen:#8AA4FF; --good:#4CC790; --warn:#F0A04B; --bad:#FF7A72; --soft:#242A3D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--pen);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800;line-height:1.05}
h2{font-size:19px;font-weight:800}
h3{font-size:16px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)} .small{font-size:13.5px}
.hl{background:linear-gradient(transparent 52%,var(--hl) 52%,var(--hl) 92%,transparent 92%);padding:0 3px;color:var(--ink)}
:root[data-theme="dark"] .hl,.darkfix .hl{color:#12151F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hl{background:none;color:var(--hl);padding:0}}
:root[data-theme="dark"] .hl{background:none;color:var(--hl);padding:0}

.app{height:100%;display:flex;flex-direction:column}
main{flex:1;overflow:auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 28px calc(16px + env(safe-area-inset-left));-webkit-overflow-scrolling:touch}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
nav{order:2;display:flex;background:var(--card);border-top:1.5px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11px;font-weight:600;color:var(--mute)}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--ink)}
nav button[aria-current="page"] span{background:linear-gradient(transparent 50%,var(--hl) 50%);color:var(--ink)}
:root[data-theme="dark"] nav button[aria-current="page"] span{color:#12151F;background:var(--hl);padding:0 4px;border-radius:3px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button[aria-current="page"] span{color:#12151F;background:var(--hl);padding:0 4px;border-radius:3px}}
.brand{display:none}
@media (min-width:900px){
  .app{flex-direction:row}
  nav{order:0;flex-direction:column;width:210px;border-top:0;border-right:1.5px solid var(--ink);padding:22px 12px;gap:4px;justify-content:flex-start}
  nav button{flex:none;flex-direction:row;gap:10px;padding:10px 12px;font-size:15px;border-radius:8px;justify-content:flex-start}
  .brand{display:block;font:800 22px/1 var(--display);padding:0 12px 18px}
  main{padding:30px 32px 40px}
  .cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
}
.cols{display:flex;flex-direction:column;gap:18px}
@media (min-width:900px){.cols{display:grid}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}

.card{background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{border-color:var(--line)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:9px;font-weight:600;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);min-height:44px;text-align:center}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.acc{background:var(--hl);color:#18203A;border-color:#18203A}
.btn.ghost{border-color:var(--line)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:600;background:var(--card);min-height:34px}
.chip .dot,.dot{width:10px;height:10px;border-radius:50%;background:var(--cc,var(--pen));flex:none}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.chip[aria-pressed="true"]::before{content:"✓";font-weight:700}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);white-space:nowrap}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],input[type=url],input[type=search],select,textarea{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;min-height:42px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--pen);outline:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:var(--mute);min-width:0}
.bar{height:9px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cc,var(--pen));border-radius:99px}
.ringt{font:800 15px var(--display);fill:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:800 24px/1.1 var(--display)}
.stat span{font-size:12.5px;color:var(--mute);font-weight:600}
button.stat{font:inherit;color:inherit;text-align:left;cursor:pointer;transition:transform .12s,box-shadow .12s}
button.stat:hover,button.stat:focus-visible{box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
button.stat i{font-style:normal;font-size:11.5px;font-weight:700;color:var(--pen);margin-top:2px}
.sheet>.seg,.sheet>.dlist,.sheet>.avg,.sheet>.dleg{flex:none}
.dlist{display:flex;flex-direction:column;gap:2px}
.dleg{font-size:12px;color:var(--mute);margin:-6px 0 0;display:flex;align-items:center;gap:6px}.dleg i{width:0;height:12px;border-left:2px dashed var(--ink)}
.drow{display:grid;grid-template-columns:92px 1fr 70px;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border:0}.drow.off{opacity:.55}.drow.t b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.drow .dl{font-size:13.5px;line-height:1.15;text-transform:capitalize}.drow .dl small{display:block;color:var(--mute);text-transform:none}
.drow .db{height:12px;background:var(--soft);border-radius:6px;position:relative}.drow .db em{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed var(--ink);opacity:.7}.drow .db span{display:block;height:100%;background:var(--pen);border-radius:6px}
.drow .dv{text-align:right;font-weight:700;font-size:14px}
.drow .dc{grid-column:2/4;font-size:12px;color:var(--mute);margin-top:-4px}
.avg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.avg div{background:var(--soft);border-radius:12px;padding:10px 12px}.avg b{display:block;font:800 22px/1.1 var(--display)}.avg span{font-size:12px;color:var(--mute);font-weight:600}
.chartbtn{all:unset;display:block;cursor:pointer;width:100%}
.timer{font:800 52px/1 var(--display);letter-spacing:-.02em}
.slot{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);font-size:14.5px}
.slot.now{border-color:var(--ink);background:var(--soft)}
.slot.past{opacity:.5}
.slot b{font-variant-numeric:tabular-nums;white-space:nowrap}
.task{display:flex;align-items:stretch;gap:6px}
.tmain{flex:1;min-width:0;text-align:left;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;display:flex;flex-direction:column;gap:1px;background:var(--card)}
.task.redo .tmain{border-color:var(--warn)}
.tname{font-weight:600;overflow-wrap:anywhere}
.tlab{font-size:13.5px;color:var(--mute)}
.task.redo .tlab{color:var(--warn);font-weight:600}
.qb{width:44px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;background:var(--card)}
.qb svg{width:20px;height:20px}
.qb.ok{color:var(--good);border-color:var(--good)} .qb.re{color:var(--warn);border-color:var(--warn)}
.todo{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo input{width:20px;height:20px;min-height:0;margin-top:2px;flex:none;accent-color:var(--ink)}
.todo.done span{text-decoration:line-through;color:var(--mute)}
.todo span{flex:1;overflow-wrap:anywhere}
.x{color:var(--mute);padding:2px 6px;font-size:18px;line-height:1}
.ccard{display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.item.skip .nm{color:var(--mute)}
.mini{width:54px;flex:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.pb{height:42px;border-radius:8px;border:1.5px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums;background:var(--card)}
.pb.s1{background:var(--warn);border-color:var(--warn);color:#fff}
.pb.s2{background:var(--good);border-color:var(--good);color:#fff}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:9px 6px;font-weight:600;font-size:14px;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.dayrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.dayrow:last-child{border-bottom:0}
.dayrow .dt{width:84px;flex:none;font-weight:700;font-size:14px}
.dayrow .dt small{display:block;font-weight:500;color:var(--mute)}
.dayrow.today .dt b{background:linear-gradient(transparent 50%,var(--hl) 50%)}
.chart{display:flex;align-items:flex-end;gap:5px;height:120px;border-bottom:1.5px solid var(--ink);padding-top:6px}
.chart div{flex:1;background:var(--pen);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.chart div.t{background:var(--hl);outline:1.5px solid var(--ink)}
.chartx{display:flex;gap:5px;font-size:10.5px;color:var(--mute)}
.chartx span{flex:1;text-align:center}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{border:1.5px dashed var(--line);border-radius:10px;padding:10px;font-size:13.5px;color:var(--mute)}
.badge.on{border:1.5px solid var(--ink);color:var(--ink);background:var(--hl);color:#18203A}
.badge b{display:block;font-family:var(--display)}
.banner{border:1.5px dashed var(--ink);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);font-size:14px}
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden],#toast[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(10,14,28,.55)}
.sheet{position:relative;background:var(--paper);border:1.5px solid var(--ink);border-bottom:0;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:92%;overflow:auto;padding:20px 16px 24px;display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){#modal{align-items:center}.sheet{border-bottom:1.5px solid var(--ink);border-radius:16px;padding:24px}}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14.5px;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (min-width:900px){#toast{bottom:28px}}
.sync{font-size:12.5px;font-weight:600;color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.sync.ok i{background:var(--good)} .sync.local i{background:var(--warn)} .sync.err i{background:var(--bad)}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
label.btn{cursor:pointer;user-select:none;-webkit-user-select:none}
.task.done .tmain{opacity:.62}.task.done .tname{text-decoration:line-through}
.tick{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--good)}
.tick svg{width:16px;height:16px}
.pkrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pkrow:last-child{border-bottom:0}
.pkrow input[type=checkbox]{width:20px;height:20px;min-height:0;flex:none;accent-color:var(--ink)}
.pkrow .rg{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--mute)}
.pkrow .rg input{width:68px;min-height:36px;padding:6px 8px}
.seclab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-top:8px}
.nudge{border:1.5px solid var(--warn);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
#toast:not([hidden]){display:flex;align-items:center;gap:12px}
#toast button{color:var(--hl);font-weight:700;text-decoration:underline;padding:2px 4px}
#drop{position:fixed;inset:10px;z-index:40;border:3px dashed var(--ink);border-radius:18px;background:var(--paper);opacity:.94;display:grid;place-items:center;font:800 24px var(--display);pointer-events:none;text-align:center;padding:20px}
#drop[hidden],#viewer[hidden]{display:none}
#viewer{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column}
#viewer header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1.5px solid var(--ink)}
#viewer iframe,#viewer img{flex:1;border:0;width:100%;min-height:0;object-fit:contain;background:#fff}
nav[hidden]{display:none!important}
.gate{min-height:100%;display:grid;place-items:center;padding:24px 0}
.gbox{width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px}
.brand2{font:800 40px/1 var(--display);letter-spacing:-.02em}
.flash{min-height:220px;border:1.5px solid var(--ink);border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px;text-align:center;width:100%}
.ftext{font:800 26px/1.2 var(--display);overflow-wrap:anywhere;white-space:pre-wrap}
.stars{display:flex;gap:4px}.stars button{font-size:28px;line-height:1;color:var(--line);padding:2px}.stars button[aria-pressed="true"]{color:var(--hl);text-shadow:0 0 0 var(--ink)}
.cardlist{max-height:260px;overflow:auto;border:1.5px solid var(--line);border-radius:10px;padding:4px 10px}
.cardlist .row{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.cardlist .row:last-child{border-bottom:0}
.boxdots{display:inline-flex;gap:2px}.boxdots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.boxdots i.on{background:var(--good)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .35s ease}}
</style>
</head>
<body>
<div class="app">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="view"></main>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status" hidden></div>
<div id="drop" hidden>Dépose tes dossiers ou fichiers de cours</div>
<div id="viewer" hidden></div>
<input type="file" id="dirpick" webkitdirectory multiple class="vh" tabindex="-1" aria-hidden="true">
<input type="file" id="filepick" multiple class="vh" tabindex="-1" aria-hidden="true">
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"><\/script>')</script>
<script>
"use strict";
/* ---------- utilitaires ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=()=>dkey();
const parseD=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(k,n)=>{const d=parseD(k);d.setDate(d.getDate()+n);return dkey(d)};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const hm2min=s=>{const a=String(s||'0:0').split(':').map(Number);return (a[0]||0)*60+(a[1]||0)};
const min2hm=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const fmtDur=m=>{m=Math.max(0,Math.round(m));const h=Math.floor(m/60);return h?h+' h '+pad(m%60):m+' min'};
const fmtClock=ms=>{const s=Math.max(0,Math.floor(ms/1000));return (s>=3600?Math.floor(s/3600)+':':'')+pad(Math.floor(s/60)%60)+':'+pad(s%60)};
const fmtDay=(k,o)=>new Intl.DateTimeFormat('fr-BE',o||{weekday:'long',day:'numeric',month:'long'}).format(parseD(k));
const cap=x=>x.charAt(0).toUpperCase()+x.slice(1);
const pct=p=>Math.round((p||0)*100)+' %';
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const clone=o=>JSON.parse(JSON.stringify(o));
const natural=(a,b)=>a.localeCompare(b,'fr',{numeric:true,sensitivity:'base'});
const TPL={
  classique:{label:'Classique : synthèses, slides, exercices',secs:[['syn','Synthèses','t'],['sli','Slides','t'],['exo','Exercices','p'],['aut','Autres','x']]},

/* Fusion : pour chaque bloc (réglages, chaque cours), la version modifiée le plus récemment gagne ; les sessions s'additionnent. */
function mergeRemote(R){
  let changed=false;S.del=S.del||{};
  if(!R||!R.main){needPush=true;return false}
  const rd=R.del||{};for(const id in rd)if(rd[id]>(S.del[id]||0))S.del[id]=rd[id];
  const rc=R.courses||{};
  const ids=new Set(['main',...Object.keys(S.courses).map(k=>'c_'+k),...Object.keys(rc).map(k=>'c_'+k)]);
  for(const id of ids){
    const r=id==='main'?R.main:rc[id.slice(2)],l=docData(id);
    const rt=r?r._t||0:-1,lt=l?l._t||0:-1,dt=S.del[id]||0;
    if(id.startsWith('c_')&&dt>Math.max(rt,lt)){if(l){delete S.courses[id.slice(2)];changed=true}if(r)needPush=true;continue}
    if(r&&rt>lt){setDoc(id,clone(r));changed=true}
    else if(l&&lt>rt)needPush=true;
  }
  const rs=(R.log&&Array.isArray(R.log.sessions))?R.log.sessions:[],ls=S.log.sessions,seen=new Set(ls.map(x=>x.id)),gone=x=>S.del['s_'+x.id];
  const add=rs.filter(x=>!seen.has(x.id)&&!gone(x)),rm=ls.filter(gone);
  if(add.length||rm.length){S.log.sessions=ls.filter(x=>!gone(x)).concat(add).sort((a,b)=>(a.at||0)-(b.at||0));changed=true}
  const rids=new Set(rs.map(x=>x.id));if(S.log.sessions.some(x=>!rids.has(x.id))||rs.some(gone))needPush=true;
  return changed;
}

/* ---------- calculs ---------- */
const courses=()=>Object.values(S.courses).sort((a,b)=>(a.exam||'9999').localeCompare(b.exam||'9999')||natural(a.name,b.name));
const itemProg=it=>{let a=0;for(const ch of it.s)a+=ch==='2'?1:ch==='1'?.5:0;return a/it.n};
const LEIT=[0,1,2,4,7,15,30];
const deckDue=a=>(a.cards||[]).filter(x=>!x.due||x.due<=TODAY());
const deckProg=a=>{const n=(a.cards||[]).length;return n?a.cards.filter(x=>x.box>=3).length/n:0};
function cProg(c,grp){const v=c.items.filter(i=>!i.skip&&gOf(c,i)!=='x'&&(!grp||gOf(c,i)===grp)).map(itemProg);if(!grp||grp==='p')(c.annexes||[]).forEach(a=>{if(a.type==='deck'&&a.cards.length)v.push(deckProg(a))});if(!v.length)return null;return v.reduce((a,b)=>a+b,0)/v.length}
function remFrac(c,grp){let r=0;for(const it of c.items){if(it.skip||gOf(c,it)!==grp)continue;let z=0;for(const ch of it.s)if(ch==='0')z++;r+=z/it.n}return r}
const sortedItems=c=>{const ix=id=>c.sections.findIndex(x=>x.id===id);return c.items.slice().sort((a,b)=>ix(a.t)-ix(b.t)||natural(a.name,b.name))};
function studyDaysLeft(c,date){
  const end=c.exam&&c.exam>date?c.exam:null;let planned=0;
  for(const d in S.main.plan)if(d>date&&(!end||d<end)&&S.main.plan[d].includes(c.id))planned++;
  planned++;
  if(c.exam&&c.exam<=date)return 1;
  if(planned>1)return planned;
  return end?Math.max(1,daysBetween(date,end)):7;
}
function ensureDay(){
  if(syncState==='connecting')return false;
  const t=TODAY(),ids=S.main.plan[t]||[];if(!ids.length)return false;
  const day=S.main.days[t]=S.main.days[t]||{};day.base=day.base||{};let ch=false;
  for(const id of ids){const c=S.courses[id];if(c&&!day.base[id]){day.base[id]={t:remFrac(c,'t'),p:remFrac(c,'p'),dl:studyDaysLeft(c,t)};ch=true}}
  if(ch){stamp('main');saveLocal();pushSoon()}
  return ch;
}
function autoTasks(c){
  const day=S.main.days[TODAY()]||{},base=day.base&&day.base[c.id],extra=(day.extra&&day.extra[c.id])||0;
  const dl=base?base.dl:studyDaysLeft(c,TODAY());const items=sortedItems(c).filter(i=>!i.skip&&gOf(c,i)!=='x');
  const tasks=[];let left=0;
  for(const it of items){const p=[];for(let i=0;i<it.n;i++)if(it.s[i]==='1')p.push(i+1);if(p.length)tasks.push({kind:'redo',it,parts:p})}
  for(const g of ['t','p']){
    const cur=remFrac(c,g),b0=base?Math.max(base[g],cur):cur;left+=cur;
    let budget=Math.min(b0,b0*(1+extra)/dl)-(b0-cur);
    for(const it of items){
      if(gOf(c,it)!==g||budget<=1e-6)continue;const p=[];
      for(let i=0;i<it.n&&budget>1e-6;i++)if(it.s[i]==='0'){p.push(i+1);budget-=1/it.n}
      if(p.length)tasks.push({kind:'new',it,parts:p});
    }
  }
  return {tasks,left,hasNew:tasks.some(t=>t.kind==='new')};
}
const pickOf=cid=>((S.main.days[TODAY()]||{}).pick||{})[cid]||null;
const pickEntry=(cid,k)=>(pickOf(cid)||[]).find(e=>e.id===k);
function dayTasks(c){
  const pk=pickOf(c.id);if(!pk)return Object.assign(autoTasks(c),{manual:false});
  const tasks=[];
  for(const e of pk){
    if(e.txt!=null){tasks.push({kind:e.done?'done':'txt',e});continue}
    const it=c.items.find(i=>i.id===e.i);if(!it)continue;
    const parts=it.n===1?[1]:(e.p||[]).filter(n=>n>=1&&n<=it.n);if(!parts.length)continue;
    tasks.push({kind:e.done?'done':'new',it,parts,e});
  }
  return {tasks,manual:true,left:0,hasNew:tasks.some(t=>t.kind!=='done')};
}
function ranges(a){const o=[];let i=0;while(i<a.length){let j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;o.push(j>i?a[i]+'–'+a[j]:''+a[i]);i=j+1}return o.join(', ')}
function taskLabel(t){const it=t.it,r=it.n===1?'':ranges(t.parts),u=it.qz?'mots ':it.mode==='l'?'n° ':'p. ';
  if(it.qz&&t.kind!=='done')return it.n===1?(t.kind==='redo'?'Quizlet · à revoir':'Quizlet · réviser le set'):(t.kind==='redo'?'Quizlet · revoir mots ':'Quizlet · mots ')+r;
  if(t.kind==='done')return (t.e.done==='1'?'Fait, à revoir':'Maîtrisé')+(r?' · '+u+r:'');
  if(it.n===1)return t.kind==='redo'?'À revoir : pas encore maîtrisé':(it.mode==='l'?'À faire':'À étudier');
  if(it.mode==='l')return (t.kind==='redo'?'Refaire n° ':'Faire n° ')+r;return (t.kind==='redo'?'Revoir p. ':'Lire p. ')+r}

/* Points calculés à partir de ce qui est enregistré : ils se synchronisent et suivent les annulations. */
function points(){
  const by={};S.log.sessions.forEach(x=>by[x.d]=(by[x.d]||0)+(+x.min||0));
  const live=timerMs()/60000;if(live>0)by[TODAY()]=(by[TODAY()]||0)+live;
  let time=0,goals=0;for(const d in by){time+=by[d];const g=isOff(d)?0:goalMin();if(g&&by[d]>=g*.75)goals++}
  let prog=0,cards=0;
  for(const c of Object.values(S.courses)){
    for(const it of c.items){if(it.skip||gOf(c,it)==='x')continue;const w=it.n===1?5:it.qz?1:it.mode==='l'?3:1;for(const ch of it.s){if(ch==='2')prog+=w;else if(ch==='1')prog+=w/2}}
    for(const a of (c.annexes||[]))if(a.type==='deck')for(const x of a.cards)cards+=(+x.r||0);
  }
  const parts={time:Math.floor(time),prog:Math.floor(prog),cards,tasks:todoCount()*15,goals:goals*100};
  const total=parts.time+parts.prog+parts.cards+parts.tasks+parts.goals;
  return {total,avail:Math.max(0,total-(S.main.spent||0)),goals,mins:time,parts};
}
function suggestToday(){const t=TODAY();return courses().filter(c=>(cProg(c)||0)<1&&(!c.exam||c.exam>t)).map(c=>({c,u:(1-(cProg(c)||0))/Math.max(1,c.exam?daysBetween(t,c.exam):30)})).sort((a,b)=>b.u-a.u).slice(0,2).map(x=>x.c.id)}
function autofill(){
  const t=TODAY(),cs=courses().filter(c=>(cProg(c)||0)<1);if(!cs.length)return 0;
  const exams=cs.map(c=>c.exam).filter(e=>e>t).sort();const last=exams.length?addDays(exams[exams.length-1],-1):addDays(t,13);
  const rem={},share={};
  cs.forEach(c=>{rem[c.id]=Math.max(.15,1-(cProg(c)||0));const dl=c.exam>t?daysBetween(t,c.exam):daysBetween(t,last)+1;share[c.id]=rem[c.id]/Math.max(1,Math.ceil(dl*2/cs.length))});
  let n=0;
  for(let d=t;d<=last;d=addDays(d,1)){
    const ex=(S.main.plan[d]||[]).filter(id=>S.courses[id]);
    if(ex.length){ex.forEach(id=>{if(rem[id])rem[id]=Math.max(.02,rem[id]-share[id])});continue}
    if(isOff(d))continue;
    const av=cs.filter(c=>!c.exam||c.exam>d);if(!av.length)continue;
    const eve=av.filter(c=>c.exam===addDays(d,1));
    const sc=c=>rem[c.id]/Math.max(1,daysBetween(d,c.exam||addDays(last,7)));
    const pick=[...new Set([...eve,...av.slice().sort((a,b)=>sc(b)-sc(a))])].slice(0,Math.max(eve.length,Math.min(2,av.length)));
    S.main.plan[d]=pick.map(c=>c.id);pick.forEach(c=>rem[c.id]=Math.max(.02,rem[c.id]-share[c.id]));n++;
  }
  return n;
}

/* Annonce les nouveaux badges et niveaux, une seule fois (mémorisé dans tes données). */
function checkBadges(){
  if(V.gate||syncState==='connecting')return;
  const pts=points(),got=badges(pts).filter(b=>b[2]).map(b=>b[0]),lvl=Math.floor(pts.total/300)+1;
  if(Object.values(S.courses).some(c=>c.demo))return;
  const seen=S.main.badgesSeen;
  if(!Array.isArray(seen)){S.main.badgesSeen=got;S.main.lvlSeen=lvl;stamp('main');saveLocal();pushSoon();return}
  const nw=got.filter(b=>!seen.includes(b));let ch=false;
  if(nw.length){S.main.badgesSeen=seen.concat(nw);ch=true;nw.forEach(b=>toastSoon('Badge débloqué : '+b+' !'))}
  if(lvl>(S.main.lvlSeen||1)){S.main.lvlSeen=lvl;ch=true;toastSoon('Niveau '+lvl+' atteint !')}
  if(ch){stamp('main');saveLocal();pushSoon()}
}

function mDays(){
  const t=TODAY(),per=T.dper||14,ss=S.log.sessions;
  const first=ss.length?ss.reduce((a,x)=>x.d<a?x.d:a,t):t;
  const n=per==='all'?Math.min(366,daysBetween(first,t)+1):per;
  const days=[];for(let i=0;i<n;i++)days.push(addDays(t,-i));
  const val=d=>d===t?minToday():minOn(d),vals=days.map(val),mx=Math.max(30,...vals);
  const tot=vals.reduce((a,b)=>a+b,0),worked=vals.filter(v=>v>0).length,best=Math.max(...vals);
  const bestD=days[vals.indexOf(best)];
  const byCourse=d=>{const o={};ss.forEach(x=>{if(x.d===d){const k=x.c&&S.courses[x.c]?x.c:'';o[k]=(o[k]||0)+x.min}});return Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,m])=>(k?esc(S.courses[k].name):'Étude libre')+' '+fmtDur(m)).join(' · ')};
  let h=`<h2>Temps étudié <span class="hl">par jour</span></h2><div class="seg">${[[7,'7 jours'],[14,'14 jours'],[30,'30 jours'],['all','Tout']].map(([k,l])=>`<button type="button" data-a="dper" data-n="${k}" aria-pressed="${per===k}">${l}</button>`).join('')}</div><p class="dleg"><i></i>ta moyenne : ${fmtDur(tot/n)} par jour</p><div class="dlist">`;
  h+=days.map((d,i)=>{const v=vals[i],bc=byCourse(d);return `<div class="drow ${d===t?'t':''} ${!v&&isOff(d)?'off':''}"><span class="dl"><b>${d===t?'Aujourd\'hui':i===1?'Hier':fmtDay(d,{weekday:'short',day:'numeric'})}</b><small>${fmtDay(d,{day:'numeric',month:'short'})}${!v&&isOff(d)?' · repos':''}</small></span><span class="db"><span style="width:${v?Math.max(3,Math.round(v/mx*100)):0}%"></span><em style="left:${Math.round(tot/n/mx*100)}%"></em></span><span class="dv num">${v?fmtDur(v):'–'}</span>${bc?`<span class="dc">${bc}</span>`:''}</div>`}).join('');
  h+=`</div><div class="avg"><div><b class="num">${fmtDur(tot/n)}</b><span>en moyenne par jour</span></div><div><b class="num">${worked?fmtDur(tot/worked):'–'}</b><span>en moyenne les jours où tu as étudié (${worked} j)</span></div><div><b class="num">${fmtDur(tot)}</b><span>au total sur la période</span></div><div><b class="num">${best?fmtDur(best):'–'}</b><span>record${best?' · '+fmtDay(bestD,{day:'numeric',month:'short'}):''}</span></div></div><button class="btn pri" data-a="close">Fermer</button>`;
  return h}

function mQzItem(){const c=S.courses[T.qz.c],x=c&&c.sections.find(y=>y.id===T.qz.s);return `<h2>Ajouter un set Quizlet${x?' dans '+esc(x.name):''}</h2><form data-f="qzitem" style="display:flex;flex-direction:column;gap:12px">

function openQuizletItem(c,it){const q=it.qz,md=it.qmode||'flashcards';showViewer(it.name,`<iframe src="https://quizlet.com/${q}/${md}/embed" title="${esc(it.name)}" allow="fullscreen"></iframe>`,`<select data-ch="qzmodeitem" data-c="${c.id}" data-i="${it.id}" aria-label="Mode Quizlet" style="width:auto;min-height:34px;padding:4px 8px">${QZ_MODES.map(x=>`<option value="${x[0]}" ${x[0]===md?'selected':''}>${x[1]}</option>`).join('')}</select><a class="btn sm ghost" href="https://quizlet.com/${q}" target="_blank" rel="noopener">Ouvrir sur Quizlet</a>`)}
async function qzFromFile(f){const e=(f.name.split('.').pop()||'').toLowerCase();if(!['webloc','url','txt'].includes(e)||f.size>200000)return null;try{const t=new TextDecoder('latin1').decode(await f.arrayBuffer());const m=t.match(/https?:\/\/(?:www\.)?quizlet\.com\/[^\s"'<>\x00-\x1f]+/i);return m&&qzId(m[0])?m[0]:null}catch(err){return null}}
function mRestore(){return `<h2>Restaurer une sauvegarde</h2><p class="small mute" style="margin:0">Colle ici le texte copié avec « Copier une sauvegarde ». Il remplace toutes les données actuelles.</p><textarea id="rs-text" rows="6" aria-label="Sauvegarde"></textarea><div class="row"><button class="btn ghost" data-a="close">Annuler</button><button class="btn pri grow" data-a="dorestore">Restaurer</button></div>`}

const curItem=()=>{const c=S.courses[T.ic];return c&&c.items.find(i=>i.id===T.ii)};

function setParts(c,it,parts,v){const a=[...it.s];parts.forEach(p=>{if(p>=1&&p<=it.n)a[p-1]=v});it.s=a.join('')}
function newCourse(name,exam,demo,tpl){const id=uid(),n=Object.keys(S.courses).length;S.courses[id]={id,name,exam:exam||'',color:COLORS[n%COLORS.length],tpl:tpl||'classique',sections:mkSecs(tpl),items:[],annexes:[]};if(demo)S.courses[id].demo=1;return S.courses[id]}
function openPick(cid){
  const c=S.courses[cid];if(!c)return;const ex=pickOf(cid),rows={};
  for(const it of c.items){let a=it.s.indexOf('0')+1;if(a<1)a=it.s.indexOf('1')+1;if(a<1)a=1;rows[it.id]={on:false,a,b:Math.min(it.n,a+(it.mode==='l'?5:10)-1)}}
  const txt=[];
  if(ex)ex.forEach(e=>{if(e.txt!=null){txt.push(clone(e));return}const r=rows[e.i];if(!r)return;r.on=true;if(e.p&&e.p.length){r.a=Math.min(...e.p);r.b=Math.max(...e.p)}});
  else autoTasks(c).tasks.forEach(t=>{const r=rows[t.it.id];if(!r)return;const lo=Math.min(...t.parts),hi=Math.max(...t.parts);if(r.on){r.a=Math.min(r.a,lo);r.b=Math.max(r.b,hi)}else{r.on=true;r.a=lo;r.b=hi}});
  T.pk={c:cid,rows,txt};openModal(mPick);
}

  mark(el){const c=S.courses[el.dataset.c],it=c&&c.items.find(i=>i.id===el.dataset.i);if(!it)return;const u=snap('c_'+c.id,'main'),p0=points().total;setParts(c,it,el.dataset.p.split(',').map(Number),el.dataset.v);markActive();if(el.dataset.k){const e=pickEntry(c.id,el.dataset.k);if(e)e.done=el.dataset.v}commit('c_'+c.id,'main');const dp=points().total-p0;toast((el.dataset.v==='2'?'Maîtrisé, bien joué.':'Noté, ça reviendra en premier.')+(dp>0?' +'+dp+' points.':''),u)},
  undone(el){const e=pickEntry(el.dataset.c,el.dataset.k);if(!e)return;e.done=0;commit('main')},

  pkdeltxt(el){T.pk.txt=T.pk.txt.filter(e=>e.id!==el.dataset.k);refresh()},
  pkok(){const c=S.courses[T.pk.c];if(!c){closeModal();return}const day=dayOf();day.pick=day.pick||{};const old=day.pick[c.id]||[],list=[];
    for(const it of sortedItems(c)){const r=T.pk.rows[it.id];if(!r||!r.on||it.skip)continue;let p=[];if(it.n===1)p=[1];else{const a=Math.max(1,Math.min(it.n,parseInt(r.a)||1)),b=Math.max(a,Math.min(it.n,parseInt(r.b)||a));for(let i=a;i<=b;i++)p.push(i)}
      const prev=old.find(e=>e.i===it.id&&String(e.p)===String(p));list.push({id:prev?prev.id:uid(),i:it.id,p,done:prev?prev.done:0})}

  study(el){const c=S.courses[el.dataset.c],a=findAnnex(el.dataset.c,el.dataset.k);if(!a)return;const q=(el.dataset.all?a.cards:deckDue(a)).map(x=>x.id);for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}T.st={c:c.id,k:a.id,q,flip:false,n:0,ok:0,miss:{}};openModal(mStudy)},

async function countParts(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase();if(!['pdf','pptx'].includes(ext)||f.size>60e6)return 1;
  try{const txt=new TextDecoder('latin1').decode(await f.arrayBuffer());
    if(ext==='pptx'){const s=new Set(txt.match(/ppt\/slides\/slide\d+\.xml/g)||[]);return s.size||1}
    const m=txt.match(/\/Type\s*\/Page(?![a-zA-Z])/g);if(m&&m.length)return m.length;
    let mx=0;for(const c of txt.matchAll(/\/Count\s+(\d+)/g))mx=Math.max(mx,+c[1]);return mx||1;
  }catch(e){return 1}
}

    if(pl.skipped)h+=`<p class="small mute" style="margin:0">${pl.skipped} fichier${pl.skipped>1?'s':''} posé${pl.skipped>1?'s':''} hors d'un dossier de cours ignoré${pl.skipped>1?'s':''}.</p>`;
  }
  return h+`<div class="row"><button class="btn ghost" data-a="close">Annuler</button><button class="btn pri grow" data-a="imgo" ${pl.list.some(x=>x.files.length)?'':'disabled'}>Importer</button></div>`;
}
let importing=false;
async function applyImport(){
  if(importing)return;importing=true;
  const {list}=planImport(),total=list.reduce((a,x)=>a+x.files.length,0);let done=0,nf=0,nc=0,np=0,last=null;const touched=new Set();
  M={fn:()=>`<h2>Import en cours…</h2><p class="num small" style="margin:0">${done} / ${total} fichiers</p>${bar(total?done/total:0)}<p class="small mute" style="margin:0">Garde cette fenêtre ouverte.</p>`};refresh();
  try{
    for(const pc of list){
      let c=pc.existing&&S.courses[pc.existing.id];
      if(!c){c=newCourse(pc.name.slice(0,80),'',false,pc.tpl);nc++;touched.add('c_'+c.id)}
      last=c.id;
      for(const fl of pc.files){
        done++;if(done%3===0){refresh();await new Promise(r=>setTimeout(r,0))}
        let x=fl.secId&&c.sections.find(y=>y.id===fl.secId);
        if(!x&&fl.folder){x=matchSec(c,fl.folder);if(!x){x={id:uid(),name:fl.folder.slice(0,60),g:guessG(fl.folder)};c.sections.push(x);touched.add('c_'+c.id)}}
        if(!x)x=defaultSec(c);
        const key=x.id+'/'+fl.rest.join('/');if(c.items.some(i=>i.key===key))continue;
        const name=fl.rest.join(' / ').replace(/\.[a-z0-9]{1,6}$/i,'');
        const ref=/corrig|solution|resol|correction|reponse/.test(norm(name));
        const qzu=await qzFromFile(fl.x.f);
        if(qzu){c.items.push(fixItem({id:uid(),t:x.id,name:name.slice(0,160),key,n:1,s:'',skip:0,qz:qzId(qzu),url:qzu,qmode:'flashcards',mode:'l'},'p'));nf++;np++;touched.add('c_'+c.id);continue}
        const n=x.g==='p'?1:await countParts(fl.x.f);
        const it=fixItem({id:uid(),t:x.id,name:name.slice(0,160),key,n,s:'',skip:(x.g==='x'||ref)?1:0},x.g);
        c.items.push(it);nf++;if(x.g==='p')np++;touched.add('c_'+c.id);
        await saveDoc(it.id,fl.x.f);
      }
    }
  }finally{importing=false;M=null}
  V.tab='cours';V.course=list.length===1?last:null;commit(...touched);
  toast(nf?nf+' fichier'+(nf>1?'s':'')+' importé'+(nf>1?'s':'')+(nc?' dans '+nc+' nouveau'+(nc>1?'x':'')+' cours':'')+(np?'. Indique le nombre d\'exercices ou de mots dans chaque fichier de pratique.':'.'):'Rien de nouveau à importer : ces fichiers sont déjà là.');
}
$('#dirpick').addEventListener('change',e=>{const fs=[...e.target.files];if(!fs.length)return;startImport(fs.map(f=>({f,p:(f.webkitRelativePath||f.name).split('/')})),T.fileTarget)});
$('#filepick').addEventListener('change',e=>{const fs=[...e.target.files],tg=T.fileTarget||{};if(!fs.length)return;if(tg.attach){attachDoc(tg.attach,fs[0]);return}startImport(fs.map(f=>({f,p:[f.name]})),tg)});
async function entriesFromDrop(dt){
  const out=[],roots=[...(dt.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean),files=[...(dt.files||[])];
  const readAll=r=>new Promise((res,rej)=>r.readEntries(res,rej));
  async function walk(en,path){
    if(en.isFile){try{const f=await new Promise((res,rej)=>en.file(res,rej));out.push({f,p:[...path,en.name]})}catch(e){}}
    else if(en.isDirectory){const r=en.createReader();let b;do{b=await readAll(r);for(const x of b)await walk(x,[...path,en.name])}while(b.length)}
  }
  if(roots.length)for(const en of roots)await walk(en,[]);else files.forEach(f=>out.push({f,p:[f.name]}));
  return out;
}
